version: "3.9"

services:

  db:
    image: postgres:15
    container_name: hireshield_db
    restart: always
    environment:
      POSTGRES_USER: hireshield
      POSTGRES_PASSWORD: hireshield123
      POSTGRES_DB: hireshield_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hireshield_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: hireshield_backend
    restart: always
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: hireshield_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
